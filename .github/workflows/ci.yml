name: CI

on:
  push:
    branches: ['6']
  pull_request:
    branches: ['6']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js-qa:
    name: JavaScript QA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # The E2E helpers typecheck against the Playwright client shipped inside
      # vendor/wedevelopnl/silverstripe-e2e, so composer deps must exist on the
      # runner (not just inside the Docker image).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl
      - uses: ramsey/composer-install@v3
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=reports/vitest-junit.xml
      - name: Verify generated files are up to date
        # client/dist is a committed build artifact. `git diff` only sees tracked
        # paths, so a brand-new output file needs the explicit untracked check.
        run: |
          npm run build
          git diff --exit-code -- client/dist
          untracked="$(git status --porcelain --untracked-files=all -- client/dist | grep '^??' || true)"
          if [ -n "$untracked" ]; then
            echo "Untracked generated files — the build produced outputs that are not committed:"
            echo "$untracked"
            exit 1
          fi
      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Vitest Results
          path: reports/vitest-junit.xml
          reporter: java-junit

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f .docker/compose.yml
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task docker-env
      - name: Start services
        run: $COMPOSE up -d --build --wait app
      - run: task analyse
      - run: task rector-dry

  php-qa:
    name: PHP QA (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    env:
      PHP_VERSION: ${{ matrix.php }}
      COMPOSE: docker compose -f .docker/compose.yml
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task docker-env
      - name: Start services
        run: $COMPOSE up -d --build --wait app
      - name: Run tests with coverage
        run: >-
          $COMPOSE exec -T app vendor/bin/phpunit
          --log-junit coverage/junit.xml
          --coverage-clover coverage/clover.xml
      - name: Check coverage threshold (90%)
        run: $COMPOSE exec -T app vendor/bin/coverage-check coverage/clover.xml 90
      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: PHPUnit Results (PHP ${{ matrix.php }})
          path: coverage/junit.xml
          reporter: java-junit

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    env:
      COMPOSE: docker compose -f .docker/compose.yml
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Playwright runs on the runner and imports authenticateAdmin from
      # vendor/wedevelopnl/silverstripe-e2e via a tsconfig paths alias, so
      # composer deps must exist there — npm cannot supply it.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl
      - uses: ramsey/composer-install@v3
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: task docker-env
      - name: Start services
        run: $COMPOSE up -d --build --wait app
      - name: Run Playwright
        run: npx playwright test --project=${{ matrix.browser }} --reporter=html,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: reports/playwright-junit.xml
      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: E2E Results (${{ matrix.browser }})
          path: reports/playwright-junit.xml
          reporter: java-junit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
